<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HINATA</title>
    <link rel="icon" type="image/svg+xml" href="assets/hinata.svg" />
    <link rel="alternate icon" type="image/x-icon" href="assets/hinata.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #060807;
        --surface: rgba(15, 20, 17, 0.82);
        --accent-primary: #15ff00;
        --accent-secondary: #ffffff;
        --glass-line: rgba(220, 255, 225, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Unbounded", sans-serif;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .embed-container {
        width: 100%;
        height: 100%;
        max-width: 1000px;
        max-height: 620px;
        background: #080808;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .embed-container:fullscreen {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
      }

      .video-wrapper {
        width: 100%;
        height: 100%;
        flex: none;
        position: relative;
        isolation: isolate;
        background: rgba(0, 0, 0, 0.72);
        overflow: hidden;
      }

      .embed-container:fullscreen .video-wrapper {
        height: auto;
        min-height: 0;
        flex: 1;
      }

      .video-wrapper video {
        position: relative;
        z-index: 0;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        display: block;
      }

      .hinata-tag {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 8px;
        letter-spacing: 2px;
        color: #000;
        background: var(--accent-primary);
        padding: 2px 8px;
        z-index: 10;
        pointer-events: none;
      }

      .play-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 72px;
        height: 72px;
        background: rgba(0, 0, 0, 0.72);
        border: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        cursor: pointer;
        transition: all 0.15s linear;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      }

      .play-overlay::after {
        content: "";
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 12px 0 12px 20px;
        border-color: transparent transparent transparent
          var(--accent-secondary);
        margin-left: 5px;
      }

      .play-overlay:hover {
        background: var(--accent-secondary);
        border-color: var(--accent-primary);
        transform: translate(-50%, -50%) scale(1.06);
      }

      .play-overlay:hover::after {
        border-color: transparent transparent transparent #000;
      }

      .hidden {
        display: none !important;
      }

      .thumb-overlay {
        position: absolute;
        inset: 0;
        z-index: 15;
        background: #000;
        pointer-events: none;
        transition: opacity 0.2s linear;
      }

      .thumb-overlay img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        opacity: 0;
        transition: opacity 0.25s linear;
      }

      .thumb-overlay img.loaded {
        opacity: 1;
      }

      .thumb-overlay.hide {
        opacity: 0;
        pointer-events: none;
      }

      .ended-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--surface);
        border: 1px solid #222;
        padding: 18px 36px;
        color: var(--accent-primary);
        font-size: 12px;
        text-align: center;
        z-index: 30;
        display: none;
        letter-spacing: 2px;
      }

      .progress-bar-wrap {
        height: 40px;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 34px;
        background: transparent;
        cursor: pointer;
        flex-shrink: 0;
        z-index: 30;
        touch-action: none;
      }

      .controls-hidden .progress-bar-wrap,
      .controls-hidden .video-controls {
        opacity: 0;
        pointer-events: none;
      }

      .progress-bar-wrap,
      .video-controls {
        transition:
          opacity 0.18s ease,
          background-color 0.18s ease;
      }

      .progress-bar-fill {
        width: 0%;
        height: 3px;
        position: absolute;
        top: 50%;
        background: var(--accent-primary);
        transform: translateY(-50%);
        transition:
          width 0.1s linear,
          height 0.15s ease;
      }

      .progress-bar-wrap::before {
        position: absolute;
        top: 50%;
        right: 0;
        left: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.35);
        content: "";
        transform: translateY(-50%);
        transition:
          height 0.15s ease,
          background-color 0.15s ease;
      }

      .progress-bar-dot {
        position: absolute;
        top: 50%;
        left: 0%;
        width: 12px;
        height: 12px;
        background: var(--accent-primary);
        border: 2px solid #080808;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 0 2px rgba(21, 255, 0, 0.22);
        transition:
          left 0.1s linear,
          width 0.15s ease,
          height 0.15s ease;
      }

      @media (hover: hover) and (pointer: fine) {
        .progress-bar-wrap:hover::before,
        .progress-bar-wrap.is-scrubbing::before {
          height: 5px;
          background: rgba(255, 255, 255, 0.55);
        }

        .progress-bar-wrap:hover .progress-bar-fill,
        .progress-bar-wrap.is-scrubbing .progress-bar-fill {
          height: 5px;
        }

        .progress-bar-wrap:hover .progress-bar-dot,
        .progress-bar-wrap.is-scrubbing .progress-bar-dot {
          width: 14px;
          height: 14px;
        }
      }

      .video-controls {
        min-height: 48px;
        flex-shrink: 0;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 9px;
        z-index: 25;
      }

      .video-control-button {
        min-width: 34px;
        height: 32px;
        padding: 0 8px;
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(220, 255, 225, 0.16);
        border-radius: 4px;
        color: var(--accent-primary);
        font-family: "Unbounded", sans-serif;
        font-size: 10px;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease,
          transform 0.15s ease;
      }

      .video-control-button:hover,
      .video-control-button:focus-visible {
        border-color: var(--accent-primary);
        background: rgba(21, 255, 0, 0.1);
        outline: none;
      }

      .video-control-button:active {
        transform: scale(0.94);
      }

      .video-time {
        min-width: 76px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 9px;
        letter-spacing: 1px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .volume-control {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-left: auto;
        color: rgba(255, 255, 255, 0.55);
        font-size: 8px;
        letter-spacing: 1px;
      }

      .volume-control input {
        width: 90px;
        height: 4px;
        accent-color: var(--accent-primary);
        cursor: pointer;
        touch-action: none;
      }

      .fullscreen-button {
        min-width: 52px;
        font-size: 8px;
        letter-spacing: 1px;
      }

      .video-control-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .video-control-button .icon {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }

      .video-control-button .icon.icon-fill {
        fill: currentColor;
        stroke: none;
      }

      .video-control-button .icon.icon-fill path {
        fill: currentColor;
        stroke: none;
      }

      @media (max-width: 520px) {
        .embed-container {
          max-height: none;
        }

        .embed-container:fullscreen {
          height: 100dvh;
        }

        .progress-bar-wrap {
          height: 44px;
          bottom: 44px;
        }

        .video-controls {
          min-height: 56px;
          gap: 7px;
          padding: 8px 10px;
        }

        .video-time {
          min-width: 70px;
          font-size: 9px;
        }

        .volume-control input {
          width: clamp(42px, 16vw, 64px);
        }

        .video-control-button {
          min-width: 40px;
          height: 40px;
          padding: 0 8px;
        }

        .fullscreen-button {
          min-width: 42px;
        }

        .fullscreen-button span {
          display: none;
        }

        .progress-bar-dot {
          width: 14px;
          height: 14px;
        }
      }

      @media (max-width: 360px) {
        .video-controls {
          gap: 5px;
          padding-right: 7px;
          padding-left: 7px;
        }

        .video-time {
          min-width: 64px;
          font-size: 8px;
          letter-spacing: 0;
        }

        .volume-control {
          gap: 4px;
          font-size: 7px;
          letter-spacing: 0;
        }

        .volume-control input {
          width: 38px;
        }

        .video-control-button {
          min-width: 36px;
          padding: 0 6px;
        }
      }
    </style>
  </head>
  <body>
    <div class="embed-container controls-hidden" id="container">
      <div class="video-wrapper">
        <video id="v" preload="metadata" playsinline>
          <source id="videoSource" src="" type="video/mp4" />
        </video>
        <div class="progress-bar-wrap" id="progressWrap">
          <div class="progress-bar-fill" id="progressFill"></div>
          <div class="progress-bar-dot" id="progressDot"></div>
        </div>
        <div class="thumb-overlay" id="thumbOverlay">
          <img id="thumbImg" alt="" />
        </div>
        <div class="hinata-tag">HINATA</div>
        <div class="play-overlay" id="playBtn"></div>
        <div class="ended-message" id="endedMessage">
          ВИДЕО ЗАВЕРШЕНО<br />
          <span style="font-size: 9px; color: #aaa; letter-spacing: 1px"
            >НАЖМИТЕ ДЛЯ ПОВТОРА</span
          >
        </div>
      </div>
      <div class="video-controls" aria-label="Управление видео">
        <button
          class="video-control-button"
          id="playPauseBtn"
          type="button"
          aria-label="Воспроизвести"
          title="Воспроизвести"
        >
          <svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7L8 5z" />
          </svg>
        </button>
        <span class="video-time"
          ><span id="currentTime">0:00</span> /
          <span id="duration">0:00</span></span
        >
        <label class="volume-control" title="Громкость">
          <span id="volumeLevel" aria-hidden="true">VOL 20%</span>
          <input
            id="volumeControl"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.2"
            aria-label="Громкость"
          />
        </label>
        <button
          class="video-control-button fullscreen-button"
          id="fullscreenBtn"
          type="button"
          aria-label="Полный экран"
          title="Полный экран"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
          </svg>
          <span>FULL</span>
        </button>
      </div>
    </div>

    <script>
      const ICONS = {
        play: `<svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>`,
        pause: `<svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>`,
        fullscreen: `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>`,
      };

      const GITHUB_USER = "xqr4d";
      const GITHUB_REPO = "Hinata";
      const VOLUME_KEY = "hinata-volume";
      const DEFAULT_VOLUME = 0.2;

      function getSavedVolume() {
        try {
          const raw = localStorage.getItem(VOLUME_KEY);
          if (raw === null) return DEFAULT_VOLUME;
          const n = parseFloat(raw);
          if (Number.isFinite(n) && n >= 0 && n <= 1) return n;
        } catch (_) {}
        return DEFAULT_VOLUME;
      }

      function saveVolume(value) {
        try {
          localStorage.setItem(VOLUME_KEY, String(value));
        } catch (_) {}
      }

      async function makeId(tag, file) {
        const str = `${tag}|${file}`;
        const buf = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(str),
        );
        const chars =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        return Array.from(new Uint8Array(buf))
          .slice(0, 8)
          .map((b) => chars[b % chars.length])
          .join("");
      }

      async function fetchAllReleases() {
        let page = 1,
          all = [];
        while (true) {
          const r = await fetch(
            `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/releases?per_page=100&page=${page}`,
          );
          if (!r.ok) throw new Error("GitHub API error");
          const batch = await r.json();
          if (!batch.length) break;
          all = all.concat(batch);
          if (batch.length < 100) break;
          page++;
        }
        return all;
      }

      async function resolveId(shortId) {
        const releases = await fetchAllReleases();
        for (const release of releases) {
          for (const asset of release.assets) {
            if (asset.name.match(/\.(mp4|mov|webm)$/i)) {
              const id = await makeId(release.tag_name, asset.name);
              if (id === shortId) {
                const thumbAsset = release.assets.find(
                  (a) => a.name === "maxresdefault.jpg",
                );
                return {
                  url: `https://github.com/${GITHUB_USER}/${GITHUB_REPO}/releases/download/${encodeURIComponent(release.tag_name)}/${encodeURIComponent(asset.name)}`,
                  thumbUrl: thumbAsset ? thumbAsset.browser_download_url : null,
                };
              }
            }
          }
        }
        return null;
      }

      const video = document.getElementById("v");
      const source = document.getElementById("videoSource");
      const container = document.getElementById("container");
      const playBtn = document.getElementById("playBtn");
      const endedMessage = document.getElementById("endedMessage");
      const fill = document.getElementById("progressFill");
      const dot = document.getElementById("progressDot");
      const wrap = document.getElementById("progressWrap");
      const playPauseBtn = document.getElementById("playPauseBtn");
      const currentTime = document.getElementById("currentTime");
      const duration = document.getElementById("duration");
      const volumeControl = document.getElementById("volumeControl");
      const volumeLevel = document.getElementById("volumeLevel");
      const fullscreenBtn = document.getElementById("fullscreenBtn");
      const thumbOverlay = document.getElementById("thumbOverlay");
      const thumbImg = document.getElementById("thumbImg");

      function showThumb(url) {
        if (!url) return;
        thumbImg.src = url;
        thumbImg.onload = () => thumbImg.classList.add("loaded");
      }

      function hideThumb() {
        thumbOverlay.classList.add("hide");
      }

      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds)) return "0:00";
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");
        return `${minutes}:${remainingSeconds}`;
      };

      const updatePlayButton = () => {
        const isPlaying = !video.paused && !video.ended;
        playPauseBtn.innerHTML = isPlaying ? ICONS.pause : ICONS.play;
        playPauseBtn.setAttribute(
          "aria-label",
          isPlaying ? "Пауза" : "Воспроизвести",
        );
        playPauseBtn.title = isPlaying ? "Пауза" : "Воспроизвести";
      };

      let lastNonZeroVolume = DEFAULT_VOLUME;

      const updateVolume = (value) => {
        const nextVolume = Math.min(1, Math.max(0, value));
        video.volume = nextVolume;
        video.muted = nextVolume === 0;
        volumeControl.value = nextVolume.toString();
        volumeLevel.textContent = `VOL ${Math.round(nextVolume * 100)}%`;
        saveVolume(nextVolume);
        if (nextVolume > 0) lastNonZeroVolume = nextVolume;
      };

      {
        const initialVolume = getSavedVolume();
        if (initialVolume > 0) lastNonZeroVolume = initialVolume;
        updateVolume(initialVolume);
      }

      playPauseBtn.addEventListener("click", () => {
        if (video.paused) {
          if (video.ended) {
            video.currentTime = 0;
            endedMessage.style.display = "none";
          }
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });

      volumeControl.addEventListener("input", () => {
        updateVolume(Number(volumeControl.value));
      });

      fullscreenBtn.addEventListener("click", () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else container.requestFullscreen();
      });

      video.addEventListener("timeupdate", () => {
        if (!video.duration) return;
        const pct = (video.currentTime / video.duration) * 100;
        fill.style.width = pct + "%";
        dot.style.left = pct + "%";
        currentTime.textContent = formatTime(video.currentTime);
      });

      video.addEventListener("loadedmetadata", () => {
        duration.textContent = formatTime(video.duration);
      });
      video.addEventListener("play", updatePlayButton);
      video.addEventListener("pause", updatePlayButton);

      const seekFromPointer = (event) => {
        if (!Number.isFinite(video.duration) || video.duration <= 0) return;
        const rect = wrap.getBoundingClientRect();
        if (!rect.width) return;
        const position = Math.min(
          1,
          Math.max(0, (event.clientX - rect.left) / rect.width),
        );
        video.currentTime = position * video.duration;
      };

      wrap.addEventListener("click", seekFromPointer);

      let scrubbingPointerId = null;

      wrap.addEventListener("pointerdown", (event) => {
        if (
          !event.isPrimary ||
          (event.pointerType === "mouse" && event.button !== 0)
        )
          return;
        event.preventDefault();
        scrubbingPointerId = event.pointerId;
        wrap.classList.add("is-scrubbing");
        wrap.setPointerCapture(event.pointerId);
        seekFromPointer(event);
      });

      wrap.addEventListener("pointermove", (event) => {
        if (event.pointerId === scrubbingPointerId) seekFromPointer(event);
      });

      const stopScrubbing = (event) => {
        if (event.pointerId !== scrubbingPointerId) return;
        scrubbingPointerId = null;
        wrap.classList.remove("is-scrubbing");
      };

      wrap.addEventListener("pointerup", stopScrubbing);
      wrap.addEventListener("pointercancel", stopScrubbing);
      wrap.addEventListener("lostpointercapture", stopScrubbing);

      document.addEventListener("keydown", (event) => {
        const target = event.target;
        if (target instanceof HTMLTextAreaElement || target.isContentEditable)
          return;

        if (event.code === "Space" || event.code === "KeyK") {
          event.preventDefault();
          if (video.paused) video.play().catch(() => {});
          else video.pause();
        } else if (event.code === "ArrowLeft" || event.code === "ArrowRight") {
          event.preventDefault();
          if (!Number.isFinite(video.duration)) return;
          const change = event.code === "ArrowLeft" ? -5 : 5;
          video.currentTime = Math.min(
            video.duration,
            Math.max(0, video.currentTime + change),
          );
        } else if (event.code === "ArrowUp" || event.code === "ArrowDown") {
          event.preventDefault();
          const currentVolume = video.muted ? 0 : video.volume;
          const change = event.code === "ArrowUp" ? 0.1 : -0.1;
          updateVolume(currentVolume + change);
        } else if (event.code === "KeyM") {
          event.preventDefault();
          if (video.muted || video.volume === 0) {
            updateVolume(lastNonZeroVolume || DEFAULT_VOLUME);
          } else {
            lastNonZeroVolume = video.volume;
            updateVolume(0);
          }
        } else if (event.code === "KeyF") {
          event.preventDefault();
          if (document.fullscreenElement) document.exitFullscreen();
          else container.requestFullscreen().catch(() => {});
        }
      });

      function startPlayer(src) {
        source.src = src;
        video.load();
      }

      container.addEventListener("click", function (e) {
        if (e.target.closest("#progressWrap, .video-controls")) return;
        if (video.paused || video.ended) {
          if (video.ended) {
            video.currentTime = 0;
            endedMessage.style.display = "none";
          }
          playBtn.classList.add("hidden");
          endedMessage.style.display = "none";
          video.play().catch(() => {
            playBtn.classList.remove("hidden");
          });
        }
      });

      video.addEventListener("ended", () => {
        playBtn.classList.remove("hidden");
        endedMessage.style.display = "block";
      });

      video.addEventListener("play", () => {
        container.classList.remove("controls-hidden");
        playBtn.classList.add("hidden");
        hideThumb();
      });

      async function init() {
        const params = new URLSearchParams(window.location.search);
        const v = params.get("v");
        if (!v) return;
        if (v.startsWith("http")) {
          startPlayer(decodeURIComponent(v));
        } else {
          try {
            const entry = await resolveId(v);
            if (entry) {
              showThumb(entry.thumbUrl);
              startPlayer(entry.url);
            }
          } catch (e) {
            console.error(e);
          }
        }
      }

      init();
    </script>
  </body>
</html>
