<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HINATA EMB</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #000;
        --surface: #0d0d0d;
        --accent-primary: #15ff00;
        --accent-secondary: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: 'Dela Gothic One', sans-serif;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .embed-container {
        width: 100%;
        height: 100%;
        max-width: 1000px;
        max-height: 620px;
        background: var(--surface);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .video-wrapper {
        flex: 1;
        position: relative;
        background: #000;
        overflow: hidden;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        display: block;
      }

      .hinata-tag {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 8px;
        letter-spacing: 2px;
        color: #000;
        background: var(--accent-primary);
        padding: 2px 8px;
        z-index: 10;
        pointer-events: none;
      }

      .play-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80px;
        height: 80px;
        background: rgba(0, 0, 0, 0.85);
        border: 4px solid var(--accent-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        cursor: pointer;
        transition: all 0.15s linear;
        box-shadow: 4px 4px 0 #000;
      }

      .play-overlay::after {
        content: '';
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 12px 0 12px 20px;
        border-color: transparent transparent transparent
          var(--accent-secondary);
        margin-left: 5px;
      }

      .play-overlay:hover {
        background: var(--accent-secondary);
        border-color: var(--accent-primary);
        transform: translate(-50%, -50%) scale(1.06);
      }

      .play-overlay:hover::after {
        border-color: transparent transparent transparent #000;
      }

      .hidden {
        display: none !important;
      }

      .ended-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--surface);
        border: 1px solid #222;
        padding: 18px 36px;
        color: var(--accent-primary);
        font-size: 12px;
        text-align: center;
        z-index: 30;
        display: none;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div class="embed-container" id="container">
      <div class="video-wrapper">
        <video id="v" preload="metadata" playsinline>
          <source id="videoSource" src="" type="video/mp4" />
        </video>
        <div class="hinata-tag">HINATA</div>
        <div class="play-overlay" id="playBtn"></div>
        <div class="ended-message" id="endedMessage">
          ВИДЕО ЗАВЕРШЕНО<br />
          <span style="font-size: 9px; color: #aaa; letter-spacing: 1px"
            >НАЖМИТЕ ДЛЯ ПОВТОРА</span
          >
        </div>
      </div>
      <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar-fill" id="progressFill"></div>
        <div class="progress-bar-dot" id="progressDot"></div>
      </div>
    </div>

    <script>
      const GITHUB_USER = 'xqr4d';
      const GITHUB_REPO = 'Hinata';

      async function makeId(tag, file) {
        const str = `${tag}|${file}`;
        const buf = await crypto.subtle.digest(
          'SHA-256',
          new TextEncoder().encode(str)
        );
        const chars =
          'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        return Array.from(new Uint8Array(buf))
          .slice(0, 8)
          .map((b) => chars[b % chars.length])
          .join('');
      }

      async function fetchAllReleases() {
        let page = 1,
          all = [];
        while (true) {
          const r = await fetch(
            `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/releases?per_page=100&page=${page}`
          );
          if (!r.ok) throw new Error('GitHub API error');
          const batch = await r.json();
          if (!batch.length) break;
          all = all.concat(batch);
          if (batch.length < 100) break;
          page++;
        }
        return all;
      }

      async function resolveId(shortId) {
        const releases = await fetchAllReleases();
        for (const release of releases) {
          for (const asset of release.assets) {
            if (asset.name.match(/\.(mp4|mov|webm)$/i)) {
              const id = await makeId(release.tag_name, asset.name);
              if (id === shortId)
                return `https://github.com/${GITHUB_USER}/${GITHUB_REPO}/releases/download/${encodeURIComponent(release.tag_name)}/${encodeURIComponent(asset.name)}`;
            }
          }
        }
        return null;
      }

      const video = document.getElementById('v');
      const source = document.getElementById('videoSource');
      const container = document.getElementById('container');
      const playBtn = document.getElementById('playBtn');
      const endedMessage = document.getElementById('endedMessage');
      const fill = document.getElementById('progressFill');
      const dot = document.getElementById('progressDot');
      const wrap = document.getElementById('progressWrap');

      video.volume = 0.2;

      video.addEventListener('timeupdate', () => {
        if (!video.duration) return;
        const pct = (video.currentTime / video.duration) * 100;
        fill.style.width = pct + '%';
        dot.style.left = pct + '%';
      });

      wrap.addEventListener('click', (e) => {
        if (!video.duration) return;
        const rect = wrap.getBoundingClientRect();
        video.currentTime =
          ((e.clientX - rect.left) / rect.width) * video.duration;
      });

      function startPlayer(src) {
        source.src = src;
        video.load();
      }

      container.addEventListener('click', function (e) {
        if (e.target.closest('#progressWrap')) return;
        if (video.paused || video.ended) {
          if (video.ended) {
            video.currentTime = 0;
            endedMessage.style.display = 'none';
          }
          playBtn.classList.add('hidden');
          endedMessage.style.display = 'none';
          video.controls = true;
          video.play().catch(() => {
            playBtn.classList.remove('hidden');
            video.controls = false;
          });
        }
      });

      video.addEventListener('ended', () => {
        playBtn.classList.remove('hidden');
        video.controls = false;
        endedMessage.style.display = 'block';
      });

      video.addEventListener('play', () => {
        playBtn.classList.add('hidden');
      });

      async function init() {
        const params = new URLSearchParams(window.location.search);
        const v = params.get('v');
        if (!v) return;
        if (v.startsWith('http')) {
          startPlayer(decodeURIComponent(v));
        } else {
          try {
            const url = await resolveId(v);
            if (url) startPlayer(url);
          } catch (e) {
            console.error(e);
          }
        }
      }

      init();
    </script>
  </body>
</html>
